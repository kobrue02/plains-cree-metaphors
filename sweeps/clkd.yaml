# Sweep for CLKD stage — optimises zero-shot macro F1 on the 228-sentence
# gold subset (CLKD never trains on gold/silver labels, so this is a genuine
# held-out signal every epoch, not a KL-divergence proxy).
# Metric: eval/best_gold_macro_f1 (maximize) — the running best-epoch value
# logged every epoch by src/figurative/distill.py, not the raw per-epoch
# eval/gold_macro_f1 — using the raw value would score a trial on whatever
# its LAST epoch happened to log, penalizing configs that peak early then
# overfit, exactly the case distill.py's best-checkpoint restore is meant to
# handle.
#
# The TLM checkpoint is fixed — set --tlm-ckpt to the best TLM run's output
# or a Hub model before running this sweep.
#
# Create:  wandb sweep sweeps/clkd.yaml
# Run:     sbatch jobs/sweep_agent.sh <sweep_id>

project: FNLP
program: tune.py
method: bayes
metric:
  name: eval/best_gold_macro_f1
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3

parameters:
  epochs:
    values: [5, 10, 15]
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 5.0e-5
  temperature:
    values: [1.0, 2.0, 3.0, 4.0]
  freeze_n_layers:
    values: [0, 6, 12]

command:
  - ${env}
  - python
  - ${program}
  - --stage
  - clkd
  - --tlm-ckpt
  - KonradBRG/xlm-mlm-plains-cree-en-tlm
  - --output-dir
  - data/sweep_clkd_trial
  - --max-length
  - "256"
